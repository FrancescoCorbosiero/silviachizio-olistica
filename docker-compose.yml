# =====================================================================
# Deploy con Caddy (caddy-docker-proxy: lucaslorentz/caddy-docker-proxy),
# come andrea-bellettati. Caddy gira in un suo container sulla rete esterna
# "caddy", legge queste label, prende i certificati HTTPS e fa da proxy.
#
#   docker network create caddy        # una volta sola, se non esiste
#   cp .env.example .env               # e compila dominio + credenziali SES
#   docker compose up -d --build
#
# Cloudflare davanti al sito (servizio "cloudflare" di andrea-bellettati) si
# aggiunge al passo 10 della roadmap, solo se servirà.
# =====================================================================
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?scrivi SITE_DOMAIN nel .env (il dominio del sito)}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_PARTITA_IVA: ${NEXT_PUBLIC_PARTITA_IVA:-}
    image: silviachizio-olistica:latest
    container_name: silviachizio-olistica
    restart: unless-stopped
    env_file: .env
    networks:
      - caddy
    expose:
      - "3000"
    labels:
      # Dominio principale → il server Next.js.
      caddy: ${SITE_DOMAIN:?scrivi SITE_DOMAIN nel .env (il dominio del sito)}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.encode: zstd gzip
      caddy.header.Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      caddy.header.-Server: ""
      # Dominio alternativo (es. www) → redirect permanente al principale.
      caddy_1: ${SITE_DOMAIN_ALT:?scrivi SITE_DOMAIN_ALT nel .env (es. www.<dominio>)}
      caddy_1.redir: "https://${SITE_DOMAIN}{uri} permanent"

networks:
  caddy:
    external: true
