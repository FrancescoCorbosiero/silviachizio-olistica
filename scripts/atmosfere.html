<!doctype html>
<meta charset="utf-8">
<!-- Generatore delle immagini d'atmosfera (scripts/atmosfere.cjs).
     Tutto disegnato qui, niente foto stock: restano finché non arrivano
     le foto vere di Silvia e dello studio (src/lib/immagini.ts). -->
<body style="margin:0;background:#000">
<script>
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* Grana: rumore fine, come la carta o l'intonaco. */
function grana(ctx, w, h, forza, seed) {
  const r = rng(seed); const img = ctx.getImageData(0, 0, w, h); const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * forza; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}
/* Intonaco: macchie larghe e morbide. */
function intonaco(ctx, w, h, seed, alpha) {
  const r = rng(seed);
  for (let i = 0; i < 70; i++) {
    const x = r() * w, y = r() * h, rr = (0.05 + r() * 0.22) * Math.max(w, h);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
    const chiaro = r() > 0.5;
    g.addColorStop(0, chiaro ? `rgba(255,236,226,${alpha})` : `rgba(60,20,25,${alpha})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
}

/* Una pianta di gigli in silhouette: stelo, foglie lunghe, fiori a trombetta. */
function giglioSagoma(ctx, x0, y0, alto, r, inclina) {
  ctx.save(); ctx.translate(x0, y0); ctx.rotate(inclina);
  ctx.lineCap = 'round';
  ctx.lineWidth = alto * 0.014; ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(alto * 0.05, -alto * 0.35, -alto * 0.04, -alto * 0.7, alto * 0.03, -alto); ctx.stroke();
  // foglie
  const nf = 5 + Math.floor(r() * 4);
  for (let i = 0; i < nf; i++) {
    const t = 0.1 + r() * 0.7, lato = r() > 0.5 ? 1 : -1, L = alto * (0.14 + r() * 0.14), cur = lato * (0.25 + r() * 0.35);
    ctx.save(); ctx.translate(0, -alto * t); ctx.rotate(lato * (0.35 + r() * 0.7));
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(L * 0.14, -L * 0.3, L * (0.1 + cur), -L * 0.75, L * cur * 1.4, -L);
    ctx.bezierCurveTo(L * (cur - 0.02), -L * 0.7, -L * 0.1, -L * 0.3, 0, 0); ctx.fill(); ctx.restore();
  }
  // fiori in cima
  const fiori = 2 + Math.floor(r() * 2);
  for (let f = 0; f < fiori; f++) {
    ctx.save(); ctx.translate(alto * 0.03, -alto * (0.9 + f * 0.04));
    ctx.rotate((f - 1) * 0.9 + (r() - 0.5) * 0.4);
    ctx.lineWidth = alto * 0.008; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -alto * 0.08); ctx.stroke();
    ctx.translate(0, -alto * 0.08);
    const P = alto * 0.12;
    for (let p = 0; p < 3; p++) {
      const lato = p - 1;
      ctx.save(); ctx.rotate(lato * 0.55 + (r() - 0.5) * 0.15);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.bezierCurveTo(P * 0.45, -P * 0.35, P * 0.4, -P * 0.8, P * (0.15 + lato * 0.35), -P * 1.05);
      ctx.bezierCurveTo(-P * 0.05 + lato * P * 0.2, -P * 0.85, -P * 0.4, -P * 0.4, 0, 0); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }
  ctx.restore();
}

/* 1. Ombre: luce del pomeriggio su un muro rosa antico, con le ombre dei gigli. */
function ombre(w, h, seed, specchio) {
  const r = rng(seed); const S = Math.max(w, h) / 2000;
  const c = canvas(w, h), ctx = c.getContext('2d');
  // muro in ombra
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#6e3237'); g.addColorStop(0.55, '#5a262c'); g.addColorStop(1, '#3a171b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  intonaco(ctx, w, h, seed + 1, 0.05);
  // la luce della finestra: un trapezio inclinato, bordi morbidi
  const luce = canvas(w, h), lc = luce.getContext('2d');
  lc.filter = `blur(${38 * S}px)`; lc.fillStyle = '#fff';
  const ox = w * 0.38;
  lc.beginPath();
  lc.moveTo(ox + w * 0.12, -h * 0.1); lc.lineTo(ox + w * 0.66, -h * 0.1);
  lc.lineTo(ox + w * 0.52, h * 1.1); lc.lineTo(ox - w * 0.06, h * 1.1); lc.closePath(); lc.fill();
  // il montante della finestra
  lc.filter = `blur(${16 * S}px)`; lc.globalCompositeOperation = 'destination-out'; lc.lineWidth = 26 * S;
  lc.beginPath(); lc.moveTo(ox + w * 0.39, -h * 0.1); lc.lineTo(ox + w * 0.23, h * 1.1); lc.stroke();
  lc.lineWidth = 20 * S; lc.beginPath(); lc.moveTo(ox + w * 0.06, h * 0.46); lc.lineTo(ox + w * 0.64, h * 0.4); lc.stroke();
  // le piante, sfocate come ombre lontane dal muro
  const pianta = canvas(w, h), pc = pianta.getContext('2d');
  pc.fillStyle = '#000'; pc.strokeStyle = '#000';
  pc.filter = `blur(${16 * S}px)`; pc.globalAlpha = 0.85;
  const base = w * 0.62;
  for (let i = 0; i < 3; i++) giglioSagoma(pc, base + (i - 1) * w * 0.09 + r() * 40 * S, h * 1.05, h * (0.7 + r() * 0.3), r, (r() - 0.5) * 0.4 + 0.12);
  pc.filter = `blur(${22 * S}px)`; pc.globalAlpha = 0.6;
  for (let i = 0; i < 3; i++) giglioSagoma(pc, base + (r() - 0.3) * w * 0.4, h * 1.1, h * (0.9 + r() * 0.3), r, (r() - 0.5) * 0.5 + 0.2);
  lc.globalCompositeOperation = 'destination-out'; lc.filter = 'none'; lc.globalAlpha = 0.7; lc.drawImage(pianta, 0, 0);
  // la luce calda sul muro
  ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.85;
  const tinta = canvas(w, h), tc = tinta.getContext('2d');
  const tg = tc.createLinearGradient(0, 0, 0, h); tg.addColorStop(0, '#ffcfae'); tg.addColorStop(1, '#f19c8f');
  tc.fillStyle = tg; tc.fillRect(0, 0, w, h); tc.globalCompositeOperation = 'destination-in'; tc.drawImage(luce, 0, 0);
  ctx.drawImage(tinta, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // vignettatura
  const v = ctx.createRadialGradient(w * 0.55, h * 0.4, Math.min(w, h) * 0.2, w * 0.5, h * 0.5, Math.max(w, h) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(25,8,10,0.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);
  grana(ctx, w, h, 9, seed + 7);
  if (!specchio) return c;
  const m = canvas(w, h), mc = m.getContext('2d'); mc.translate(w, 0); mc.scale(-1, 1); mc.drawImage(c, 0, 0);
  return m;
}

/* 2. Seta: un drappo color lily con pieghe morbide. */
function seta(w, h, seed, scuro) {
  const r = rng(seed); const c = canvas(w, h), ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h); const d = img.data;
  const onde = Array.from({ length: 7 }, (_, i) => ({ a: (0.9 / (i + 1)) * (0.6 + r() * 0.6), k: (1.6 + i * 1.15 + r()) / Math.max(w, h) * 6.2832, ang: -0.55 + (r() - 0.5) * 0.5, ph: r() * 6.28, w: r() * 2 }));
  const H = (x, y) => {
    let s = 0; const warp = Math.sin(y / h * 3.1 + 1.3) * w * 0.05 + Math.sin(x / w * 2.3) * h * 0.03;
    for (const o of onde) { const u = (x + warp) * Math.cos(o.ang) + y * Math.sin(o.ang); s += o.a * Math.sin(u * o.k + o.ph + o.w * Math.sin(y / h * 2)); }
    return s;
  };
  const lx = -0.45, ly = -0.6, lz = 0.66; const e = 1.2;
  const pal = scuro ? [[38, 6, 18], [120, 14, 52], [214, 70, 112], [255, 196, 206]] : [[96, 10, 42], [196, 10, 76], [242, 96, 140], [255, 214, 224]];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const A = 55 * Math.max(w, h) / 2000;
    const hx = (H(x + e, y) - H(x - e, y)) / (2 * e) * A, hy = (H(x, y + e) - H(x, y - e)) / (2 * e) * A;
    const n = 1 / Math.hypot(hx, hy, 1); const nx = -hx * n, ny = -hy * n, nz = n;
    let L = Math.max(0, nx * lx + ny * ly + nz * lz);
    const spec = Math.pow(Math.max(0, nz * 0.9 + nx * -0.3 + ny * -0.3), 28) * 0.55;
    L = Math.min(1, L * 0.9 + 0.05);
    const t = L * 3, i0 = Math.min(2, Math.floor(t)), f = t - i0;
    const i = (y * w + x) * 4;
    for (let k = 0; k < 3; k++) d[i + k] = pal[i0][k] + (pal[i0 + 1][k] - pal[i0][k]) * f + spec * 255;
    d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const v = ctx.createRadialGradient(w * 0.5, h * 0.45, Math.min(w, h) * 0.25, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(30,4,14,0.5)'); ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);
  grana(ctx, w, h, 6, seed + 3);
  return c;
}

/* 3. Candele: il buio caldo con le luci fuori fuoco. */
function candela(w, h, seed) {
  const r = rng(seed); const S = Math.max(w, h) / 2000; const c = canvas(w, h), ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#1c1210'); g.addColorStop(1, '#2a1915');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const glow = (x, y, rr, col, a) => { const gg = ctx.createRadialGradient(x, y, 0, x, y, rr); gg.addColorStop(0, `rgba(${col},${a})`); gg.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = gg; ctx.fillRect(0, 0, w, h); };
  glow(w * 0.74, h * 0.62, Math.max(w, h) * 0.55, '246,170,110', 0.32);
  glow(w * 0.9, h * 0.2, Math.max(w, h) * 0.3, '224,60,110', 0.16);
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 46; i++) {
    const x = w * (0.42 + r() * 0.62), y = h * (0.12 + r() * 0.82), rr = (24 + r() * 90) * S;
    const rosa = r() < 0.25; const col = rosa ? '242,79,128' : r() < 0.5 ? '246,194,139' : '252,226,188';
    ctx.filter = `blur(${(2 + r() * 10) * S}px)`;
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.283);
    const gg = ctx.createRadialGradient(x, y, rr * 0.2, x, y, rr);
    const a = 0.12 + r() * 0.35;
    gg.addColorStop(0, `rgba(${col},${a * 0.7})`); gg.addColorStop(0.85, `rgba(${col},${a})`); gg.addColorStop(1, `rgba(${col},${a * 0.4})`);
    ctx.fillStyle = gg; ctx.fill();
  }
  // tre fiamme, piccole e nette
  ctx.filter = `blur(${3 * S}px)`;
  [[0.66, 0.7], [0.76, 0.64], [0.84, 0.74]].forEach(([fx, fy], i) => {
    const x = w * fx, y = h * fy, s = (1 - i * 0.12) * 22 * S;
    glow(x, y - s, s * 9, '255,200,140', 0.45);
    ctx.fillStyle = 'rgba(255,240,215,0.95)'; ctx.beginPath(); ctx.ellipse(x, y - s, s * 0.45, s * 1.15, 0, 0, 6.283); ctx.fill();
  });
  ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  grana(ctx, w, h, 10, seed + 5);
  return c;
}

/* 4. Velo: petali fuori fuoco, rosa e cera, luminosi. */
function velo(w, h, seed) {
  const r = rng(seed); const S = Math.max(w, h) / 2000; const c = canvas(w, h), ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, h, w, 0); g.addColorStop(0, '#8a1840'); g.addColorStop(0.5, '#c4405e'); g.addColorStop(1, '#f2b49a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const cols = ['248,170,198', '252,226,188', '224,11,87', '196,10,76', '255,240,236', '242,79,128'];
  for (let i = 0; i < 26; i++) {
    const x = r() * w, y = r() * h, rx = (160 + r() * 420) * S, ry = rx * (0.28 + r() * 0.3);
    ctx.save(); ctx.translate(x, y); ctx.rotate(r() * 3.14);
    ctx.filter = `blur(${(30 + r() * 60) * S}px)`;
    ctx.fillStyle = `rgba(${cols[Math.floor(r() * cols.length)]},${0.25 + r() * 0.4})`;
    ctx.beginPath(); ctx.moveTo(-rx, 0); ctx.quadraticCurveTo(0, -ry * 2, rx, 0); ctx.quadraticCurveTo(0, ry * 0.6, -rx, 0); ctx.fill();
    ctx.restore();
  }
  ctx.filter = 'none';
  grana(ctx, w, h, 8, seed + 2);
  return c;
}

/* 5. Lino: tela calda color sabbia rosata, con una piega di luce. */
function lino(w, h, seed) {
  const r = rng(seed); const c = canvas(w, h), ctx = c.getContext('2d');
  ctx.fillStyle = '#efdcd3'; ctx.fillRect(0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const fx = Array.from({ length: w }, () => (r() - 0.5) * 9), fy = Array.from({ length: h }, () => (r() - 0.5) * 9);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4; const n = fx[x] + fy[y] + (r() - 0.5) * 6 + Math.sin(x * 1.9) * 1.5 + Math.sin(y * 2.1) * 1.5;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
  const l = ctx.createLinearGradient(0, 0, w, h * 0.6);
  l.addColorStop(0, 'rgba(255,246,240,0.5)'); l.addColorStop(0.45, 'rgba(255,246,240,0)'); l.addColorStop(0.7, 'rgba(150,90,90,0.12)'); l.addColorStop(1, 'rgba(150,90,90,0.22)');
  ctx.fillStyle = l; ctx.fillRect(0, 0, w, h);
  return c;
}

/* 6. Montagne: creste una dietro l'altra nella luce del tramonto (l'arrampicata). */
function montagne(w, h, seed) {
  const r = rng(seed); const S = Math.max(w, h) / 2000; const c = canvas(w, h), ctx = c.getContext('2d');
  const cielo = ctx.createLinearGradient(0, 0, 0, h);
  cielo.addColorStop(0, '#f6d3b8'); cielo.addColorStop(0.45, '#f2b7a8'); cielo.addColorStop(0.75, '#e79aa5'); cielo.addColorStop(1, '#c86d86');
  ctx.fillStyle = cielo; ctx.fillRect(0, 0, w, h);
  // il sole basso, morbido
  const sx = w * 0.68, sy = h * 0.5, sr = Math.min(w, h) * 0.09;
  const alone = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 6);
  alone.addColorStop(0, 'rgba(255,240,220,0.9)'); alone.addColorStop(0.18, 'rgba(255,226,200,0.5)'); alone.addColorStop(1, 'rgba(255,226,200,0)');
  ctx.fillStyle = alone; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,246,236,0.95)'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.283); ctx.fill();
  // creste: rumore a punto medio, dal fondo (chiaro) al primo piano (vino)
  const cresta = (base, ampiezza, rugosita) => {
    const n = 257; const pts = new Array(n).fill(0);
    pts[0] = (r() - 0.5) * ampiezza; pts[n - 1] = (r() - 0.5) * ampiezza;
    for (let passo = n - 1, a = ampiezza; passo > 1; passo >>= 1, a *= rugosita)
      for (let i = passo >> 1; i < n; i += passo) pts[i] = (pts[i - (passo >> 1)] + pts[i + (passo >> 1)]) / 2 + (r() - 0.5) * a;
    return pts.map((v, i) => [(i / (n - 1)) * w, base + v]);
  };
  const strati = [
    ['#d98a98', 0.5, 0.42, 0.58],
    ['#b8607a', 0.56, 0.36, 0.56],
    ['#8e3a5a', 0.64, 0.32, 0.55],
    ['#64223f', 0.74, 0.3, 0.52],
    ['#3a1424', 0.86, 0.26, 0.5],
  ];
  strati.forEach(([col, base, amp, rug], i) => {
    const pts = cresta(h * base, h * amp, rug);
    ctx.beginPath(); ctx.moveTo(0, h);
    pts.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(w, h); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    // foschia tra uno strato e l'altro
    const f = ctx.createLinearGradient(0, h * (base - 0.1), 0, h);
    f.addColorStop(0, `rgba(246,200,190,${0.32 - i * 0.05})`); f.addColorStop(1, 'rgba(246,200,190,0)');
    ctx.fillStyle = f; ctx.fillRect(0, 0, w, h);
  });
  grana(ctx, w, h, 7, seed + 9);
  return c;
}

/* 7. Pagine: un libro di poesie aperto, visto dall'alto, nella luce calda. */
function pagine(w, h, seed) {
  const r = rng(seed); const S = Math.max(w, h) / 2000; const c = canvas(w, h), ctx = c.getContext('2d');
  ctx.fillStyle = '#5a2a33'; ctx.fillRect(0, 0, w, h);
  // il libro: due pagine leggermente bombate
  const bx = w * 0.12, by = h * 0.08, bw = w * 0.76, bh = h * 0.92;
  const carta = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  carta.addColorStop(0, '#efe0d2'); carta.addColorStop(0.47, '#f6ebe0'); carta.addColorStop(0.5, '#cdb5a6'); carta.addColorStop(0.53, '#f6ebe0'); carta.addColorStop(1, '#ecdccd');
  ctx.save(); ctx.shadowColor = 'rgba(20,6,10,0.5)'; ctx.shadowBlur = 60 * S; ctx.shadowOffsetY = 20 * S;
  ctx.fillStyle = carta; ctx.fillRect(bx, by, bw, bh); ctx.restore();
  // la piega al centro
  const piega = ctx.createLinearGradient(bx + bw * 0.44, 0, bx + bw * 0.56, 0);
  piega.addColorStop(0, 'rgba(90,50,50,0)'); piega.addColorStop(0.5, 'rgba(90,50,50,0.28)'); piega.addColorStop(1, 'rgba(90,50,50,0)');
  ctx.fillStyle = piega; ctx.fillRect(bx, by, bw, bh);
  // le strofe: righe brevi, a sinistra, a gruppi
  ctx.fillStyle = 'rgba(60,36,38,0.55)';
  const pagina = (x0) => {
    let y = by + bh * 0.12; const lh = 26 * S; const x = x0 + bw * 0.07;
    // il titolo
    ctx.fillRect(x, y, bw * (0.12 + r() * 0.08), 9 * S); y += lh * 2.2;
    while (y < by + bh * 0.9) {
      const versi = 3 + Math.floor(r() * 3);
      for (let v = 0; v < versi && y < by + bh * 0.9; v++) {
        let xx = x; const fine = x + bw * (0.16 + r() * 0.2);
        while (xx < fine) { const parola = (14 + r() * 46) * S; ctx.fillRect(xx, y, Math.min(parola, fine - xx), 5.5 * S); xx += parola + 9 * S; }
        y += lh;
      }
      y += lh * 0.9;
    }
  };
  ctx.filter = `blur(${1.1 * S}px)`; pagina(bx); pagina(bx + bw * 0.5); ctx.filter = 'none';
  // un giglio pressato tra le pagine, e la sua ombra
  ctx.save(); ctx.filter = `blur(${10 * S}px)`; ctx.fillStyle = 'rgba(40,10,20,0.25)'; ctx.strokeStyle = 'rgba(40,10,20,0.25)';
  giglioSagoma(ctx, bx + bw * 0.8, by + bh * 0.98, bh * 0.5, r, -0.5); ctx.restore();
  ctx.save(); ctx.fillStyle = 'rgba(214,92,128,0.85)'; ctx.strokeStyle = 'rgba(160,154,93,0.9)';
  giglioSagoma(ctx, bx + bw * 0.77, by + bh * 0.95, bh * 0.48, r, -0.5); ctx.restore();
  // la luce calda da sinistra
  const luce = ctx.createLinearGradient(0, 0, w, h);
  luce.addColorStop(0, 'rgba(255,214,170,0.28)'); luce.addColorStop(0.6, 'rgba(255,214,170,0)'); luce.addColorStop(1, 'rgba(40,10,20,0.35)');
  ctx.fillStyle = luce; ctx.fillRect(0, 0, w, h);
  // la sera: la lampada illumina il centro, il resto scende nel buio
  const sera = ctx.createRadialGradient(w * 0.62, h * 0.42, Math.min(w, h) * 0.12, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
  sera.addColorStop(0, 'rgba(40,12,20,0)'); sera.addColorStop(1, 'rgba(40,12,20,0.62)');
  ctx.fillStyle = sera; ctx.fillRect(0, 0, w, h);
  grana(ctx, w, h, 8, seed + 4);
  return c;
}

/* 8. Pellicola: tre fotogrammi su una striscia di negativo (la fotografia). */
async function pellicola(w, h, seed, fotogrammi) {
  const S = Math.max(w, h) / 2000; const c = canvas(w, h), ctx = c.getContext('2d');
  ctx.fillStyle = '#1e1513'; ctx.fillRect(0, 0, w, h);
  const imgs = await Promise.all(fotogrammi.map((src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src; })));
  const verticale = h > w;
  const n = imgs.length;
  // la striscia
  const sh = verticale ? h * 0.92 : h * 0.62, sw = verticale ? w * 0.62 : w * 1.1;
  const sx = (w - sw) / 2, sy = (h - sh) / 2;
  ctx.fillStyle = '#3b2216'; ctx.fillRect(sx, sy, sw, sh);
  // i fori
  ctx.fillStyle = '#1e1513';
  const foro = 18 * S, passo = 46 * S;
  if (verticale) {
    for (let y = sy + 20 * S; y < sy + sh - 20 * S; y += passo) { ctx.fillRect(sx + 18 * S, y, foro, foro * 1.4); ctx.fillRect(sx + sw - 18 * S - foro, y, foro, foro * 1.4); }
  } else {
    for (let x = sx + 10 * S; x < sx + sw; x += passo) { ctx.fillRect(x, sy + 18 * S, foro * 1.4, foro); ctx.fillRect(x, sy + sh - 18 * S - foro, foro * 1.4, foro); }
  }
  // i fotogrammi
  const m = 70 * S, gap = 26 * S;
  for (let k = 0; k < n; k++) {
    let fx, fy, fw, fh;
    if (verticale) { fw = sw - 2 * m; fh = (sh - 2 * 40 * S - gap * (n - 1)) / n; fx = sx + m; fy = sy + 40 * S + k * (fh + gap); }
    else { fh = sh - 2 * m; fw = (sw - 2 * 60 * S - gap * (n - 1)) / n; fy = sy + m; fx = sx + 60 * S + k * (fw + gap); }
    const im = imgs[k]; const ar = fw / fh; let iw = im.width, ih = im.width / ar; if (ih > im.height) { ih = im.height; iw = ih * ar; }
    ctx.drawImage(im, (im.width - iw) / 2, (im.height - ih) / 2, iw, ih, fx, fy, fw, fh);
    // i numeri del fotogramma sul bordo
    ctx.fillStyle = 'rgba(246,194,139,0.75)'; ctx.font = `${20 * S}px sans-serif`;
    if (verticale) ctx.fillText(String(12 + k), sx + 48 * S, fy + fh - 8 * S); else ctx.fillText(`${12 + k}  ▸`, fx + 4 * S, sy + sh - 44 * S);
  }
  // la luce che filtra dal bordo, come nei rullini
  const fuga = ctx.createLinearGradient(0, 0, w, 0);
  fuga.addColorStop(0, 'rgba(255,120,60,0.35)'); fuga.addColorStop(0.25, 'rgba(255,120,60,0)'); fuga.addColorStop(0.85, 'rgba(240,60,110,0)'); fuga.addColorStop(1, 'rgba(240,60,110,0.3)');
  ctx.fillStyle = fuga; ctx.fillRect(0, 0, w, h);
  grana(ctx, w, h, 10, seed + 6);
  return c;
}

window.genera = async (nome, w, h, variante, extra) => {
  if (nome === 'pellicola') return (await pellicola(w, h, 61, extra)).toDataURL('image/webp', 0.8);
  if (nome === 'montagne') return montagne(w, h, 71).toDataURL('image/webp', 0.8);
  if (nome === 'pagine') return pagine(w, h, 81).toDataURL('image/webp', 0.8);
  const f = { ombre: () => ombre(w, h, 11, variante === 'specchio'), seta: () => seta(w, h, 21, variante === 'scuro'), candela: () => candela(w, h, 31), velo: () => velo(w, h, 41), lino: () => lino(w, h, 51) }[nome];
  return f().toDataURL('image/webp', 0.8);
};
